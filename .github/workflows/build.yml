name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK litsenziyalarini tasdiqlash
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Loyihani avtomatik tayyorlash va APK yig'ish
        run: |
          npm install -g cordova
          cordova create app uz.uztac.ratsiya "UZ-TAC Ratsiya"
          find . -maxdepth 2 -iname "index.html" -exec cp {} app/www/index.html \;
          cd app
          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="uz.uztac.ratsiya" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:android="http://schemas.android.com/apk/res/android">
              <name>UZ-TAC Ratsiya</name>
              <content src="index.html" />
              <access origin="*" />
              <preference name="KeepRunning" value="true" />
              <preference name="Orientation" value="portrait" />
              <platform name="android">
                  <preference name="AndroidMinSdkVersion" value="24" />
                  <preference name="AndroidTargetSdkVersion" value="34" />
                  <config-file parent="/manifest" target="AndroidManifest.xml">
                      <uses-permission android:name="android.permission.INTERNET" />
                      <uses-permission android:name="android.permission.RECORD_AUDIO" />
                      <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
                      <uses-permission android:name="android.permission.WAKE_LOCK" />
                  </config-file>
              </platform>
          </widget>
          EOF
          cordova plugin add cordova-plugin-android-permissions cordova-plugin-insomnia
          cordova platform add android --no-telemetry
          cordova build android --debug --no-telemetry

      - name: Tayyor APK ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: UZTAC-Ratsiya-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
